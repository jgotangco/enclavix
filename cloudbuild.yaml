steps:
  # 1. Build Docker image with Google Cloud Build
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--no-cache'
      - '-t'
      - 'gcr.io/$PROJECT_ID/enclave-hoa:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/enclave-hoa:latest'
      - '.'

  # 2. Push image to Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/enclave-hoa:$COMMIT_SHA']

  # 3. Deploy container image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'enclave-hoa'
      - '--image'
      - 'gcr.io/$PROJECT_ID/enclave-hoa:$COMMIT_SHA'
      - '--region'
      - 'asia-southeast1' # Singapore / SE Asia low latency for Philippines
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'

images:
  - 'gcr.io/$PROJECT_ID/enclave-hoa:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/enclave-hoa:latest'
